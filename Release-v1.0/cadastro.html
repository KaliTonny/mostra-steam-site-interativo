<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Cadastro | Turismo 360°
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="cadastro-container">
   <section class="auth-box">
    <h1>
     Turismo 360°
    </h1>
    <p class="intro" data-i18n="register_intro">
    </p>
    <form class="form-grid" id="cadastroForm">
     <label data-i18n="name" for="nome">
     </label>
     <input data-i18n-placeholder="name_placeholder" id="nome" required="" type="text"/>
     <label data-i18n="email" for="email">
     </label>
     <input data-i18n-placeholder="email_placeholder" id="email" required="" type="email"/>
     <label data-i18n="password" for="senha">
     </label>
     <div class="password-wrap">
      <input autocomplete="new-password" data-i18n-placeholder="password_placeholder" id="senha" required="" type="password"/>
      <button aria-label="Mostrar senha" class="password-toggle" data-toggle-password="senha" type="button">
       👁
      </button>
     </div>
     <div class="password-strength">
      <div id="strengthBar">
      </div>
     </div>
     <small id="strengthText">
      Força da senha
     </small>
     <ul class="password-rules">
      <li data-rule="length">
       8 ou mais caracteres
      </li>
      <li data-rule="upper">
       Uma letra maiúscula
      </li>
      <li data-rule="lower">
       Uma letra minúscula
      </li>
      <li data-rule="number">
       Um número
      </li>
      <li data-rule="special">
       Um caractere especial
      </li>
     </ul>
     <label for="confirmarSenha">
      Confirmar senha
     </label>
     <div class="password-wrap">
      <input autocomplete="new-password" id="confirmarSenha" placeholder="Digite a senha novamente" required="" type="password"/>
      <button aria-label="Mostrar senha" class="password-toggle" data-toggle-password="confirmarSenha" type="button">
       👁
      </button>
     </div>
     <small id="matchText">
     </small>
     <button class="primary" data-i18n="register" type="submit">
     </button>
     <p id="mensagem">
     </p>
    </form>
    <p class="auth-links">
     <span data-i18n="already_account">
     </span>
     <a data-i18n="enter" href="login.html">
     </a>
     ·
     <a data-i18n="back_home" href="home.html">
     </a>
    </p>
   </section>
  </main>
  <footer>
   <div data-i18n="footer">
   </div>
   <div class="steam" data-i18n="steam">
   </div>
  </footer>
  <script src="script.js">
  </script>
 </body>
</html>
