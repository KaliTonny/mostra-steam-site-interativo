<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Login | Turismo 360°
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="login-container">
   <section class="auth-box">
    <h1>
     Turismo 360°
    </h1>
    <h2 data-i18n="login_title">
    </h2>
    <form class="form-grid" id="loginForm" style="margin-top:18px">
     <label data-i18n="email" for="email">
     </label>
     <input data-i18n-placeholder="email_placeholder" id="email" required="" type="email"/>
     <label data-i18n="password" for="senha">
     </label>
     <input data-i18n-placeholder="password_placeholder" id="senha" required="" type="password"/>
     <button class="primary" data-i18n="enter" type="submit">
     </button>
     <p id="mensagem">
     </p>
    </form>
    <p class="auth-links">
     <span data-i18n="no_account">
     </span>
     <a data-i18n="create_account" href="cadastro.html">
     </a>
     ·
     <a data-i18n="back_home" href="home.html">
     </a>
    </p>
   </section>
  </main>
  <footer>
   <div data-i18n="footer">
   </div>
   <div class="steam" data-i18n="steam">
   </div>
  </footer>
  <script src="script.js">
  </script>
 </body>
</html>
