<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Verificar e-mail | Turismo 360°
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="cadastro-container">
   <section class="auth-box verification-box">
    <h1>
     Verifique seu e-mail
    </h1>
    <p class="intro">
     Enviamos um código de 6 dígitos para
     <strong id="maskedEmail">
     </strong>
     .
    </p>
    <form class="form-grid" id="verifyForm">
     <label for="codigo">
      Código de verificação
     </label>
     <input autocomplete="one-time-code" class="code-input" id="codigo" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required=""/>
     <button class="primary" type="submit">
      Verificar código
     </button>
     <p id="verifyStatus">
     </p>
    </form>
    <button class="secondary resend-btn" id="resendCode" type="button">
     Reenviar código em 60s
    </button>
    <p class="auth-links">
     <a href="login.html">
      Voltar para o login
     </a>
    </p>
   </section>
  </main>
  <footer>
   <div>
    © 2026 - Desenvolvido por Etony Guedes e Geovanna Almeida
   </div>
  </footer>
  <script src="script.js">
  </script>
 </body>
</html>
