<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Explorar | Turismo 360°
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <nav>
    <a class="logo" href="home.html">
     Turismo 360°
    </a>
    <button class="menu-toggle" id="menuToggle">
     ☰
    </button>
    <div class="nav-links">
     <a data-i18n="nav_home" href="home.html">
     </a>
     <a data-i18n="nav_about" href="sobre.html">
     </a>
     <a data-i18n="nav_projects" href="projetos.html">
     </a>
     <a data-i18n="nav_profile" href="perfil.html">
     </a>
     <a data-i18n="nav_settings" href="configuracoes.html">
     </a>
     <a data-i18n="nav_contact" href="contato.html">
     </a>
     <a data-auth="guest" data-i18n="nav_register" href="cadastro.html">
     </a>
     <a data-auth="guest" data-i18n="nav_login" href="login.html">
     </a>
     <button data-action="logout" data-auth="user" data-i18n="nav_logout">
     </button>
    </div>
   </nav>
  </header>
  <main class="container">
   <div class="page-heading">
    <h1 data-i18n="projects_title">
    </h1>
    <p data-i18n="explore_intro">
    </p>
   </div>
   <section class="city-services">
    <div class="section-title">
     <div>
      <h2 data-i18n="city_services">
      </h2>
      <p data-i18n="city_services_desc">
      </p>
     </div>
    </div>
    <div class="service-chips">
     <button class="service-chip" data-i18n="cat_hotels" data-query="hotel pousada">
     </button>
     <button class="service-chip" data-i18n="cat_restaurants" data-query="restaurante">
     </button>
     <button class="service-chip" data-i18n="cat_markets" data-query="supermercado mercado">
     </button>
     <button class="service-chip" data-i18n="cat_religious" data-query="igreja espaço religioso">
     </button>
     <button class="service-chip" data-i18n="cat_leisure" data-query="praça lazer">
     </button>
     <button class="service-chip" data-i18n="cat_tourism" data-query="ponto turístico">
     </button>
     <button class="service-chip" data-i18n="svc_pharmacy" data-query="farmácia">
     </button>
     <button class="service-chip" data-i18n="svc_health" data-query="hospital clínica">
     </button>
     <button class="service-chip" data-i18n="svc_fuel" data-query="posto de combustível">
     </button>
     <button class="service-chip" data-i18n="svc_gym" data-query="academia">
     </button>
     <button class="service-chip" data-i18n="svc_bakery" data-query="padaria">
     </button>
     <button class="service-chip" data-i18n="svc_bank" data-query="banco caixa eletrônico">
     </button>
     <button class="service-chip" data-i18n="svc_pet" data-query="pet shop veterinário">
     </button>
     <button class="service-chip" data-i18n="svc_transport" data-query="rodoviária transporte">
     </button>
     <button class="service-chip" data-i18n="svc_auto" data-query="oficina automotiva">
     </button>
     <button class="service-chip" data-i18n="svc_beauty" data-query="salão barbearia">
     </button>
     <button class="service-chip" data-i18n="svc_shopping" data-query="lojas comércio">
     </button>
     <button class="service-chip" data-i18n="svc_pizza" data-query="pizzaria lanchonete">
     </button>
    </div>
   </section>
   <div class="toolbar">
    <input class="search" data-i18n-placeholder="search_placeholder" id="pesquisa"/>
    <div class="filters">
     <button class="filter-btn active" data-filter="all" data-i18n="all">
     </button>
     <button class="filter-btn" data-filter="turismo" data-i18n="cat_tourism">
     </button>
     <button class="filter-btn" data-filter="religioso" data-i18n="cat_religious">
     </button>
     <button class="filter-btn" data-filter="hotel" data-i18n="cat_hotels">
     </button>
     <button class="filter-btn" data-filter="restaurante" data-i18n="cat_restaurants">
     </button>
     <button class="filter-btn" data-filter="mercado" data-i18n="cat_markets">
     </button>
     <button class="filter-btn" data-filter="lazer" data-i18n="cat_leisure">
     </button>
     <button class="filter-btn" data-filter="event" data-i18n="events_filter">
     </button>
    </div>
   </div>
   <div class="grid" id="exploreGrid">
    <div class="status-card" data-i18n="loading">
    </div>
   </div>
   <div id="mapsResults">
   </div>
  </main>
  <div class="modal" hidden="" id="detailsModal">
   <div class="modal-card">
    <button class="modal-close" data-close-modal="">
     ×
    </button>
    <img alt="" class="modal-image" src=""/>
    <span class="tag modal-category">
    </span>
    <h2 class="modal-title">
    </h2>
    <p class="modal-address">
    </p>
    <p class="modal-text" style="margin:12px 0 18px;line-height:1.6">
    </p>
    <a class="btn map-link" rel="noopener" target="_blank">
    </a>
   </div>
   <div data-close-modal="" style="position:absolute;inset:0;z-index:-1">
   </div>
  </div>
  <footer>
   <div data-i18n="footer">
   </div>
   <div class="steam" data-i18n="steam">
   </div>
  </footer>
  <script src="script.js">
  </script>
  <script>
   document.addEventListener('DOMContentLoaded',()=>{const f=new URLSearchParams(location.search).get('filter');if(f){const b=document.querySelector(`[data-filter="${f}"]`);if(b)b.click();}})
  </script>
 </body>
</html>
