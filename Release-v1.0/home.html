<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Turismo 360°
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <nav>
    <a class="logo" href="home.html">
     Turismo 360°
    </a>
    <button aria-expanded="false" class="menu-toggle" id="menuToggle">
     ☰
    </button>
    <div class="nav-links">
     <a data-i18n="nav_home" href="home.html">
     </a>
     <a data-i18n="nav_about" href="sobre.html">
     </a>
     <a data-i18n="nav_projects" href="projetos.html">
     </a>
     <a data-i18n="nav_profile" href="perfil.html">
     </a>
     <a data-i18n="nav_settings" href="configuracoes.html">
     </a>
     <a data-i18n="nav_contact" href="contato.html">
     </a>
     <a data-auth="guest" data-i18n="nav_register" href="cadastro.html">
     </a>
     <a data-auth="guest" data-i18n="nav_login" href="login.html">
     </a>
     <button data-action="logout" data-auth="user" data-i18n="nav_logout">
     </button>
    </div>
   </nav>
  </header>
  <section class="hero">
   <h1 data-i18n="hero_title">
   </h1>
   <p data-i18n="hero_text">
   </p>
  </section>
  <section class="banner">
   <button class="banner-btn prev" id="prev">
    ‹
   </button>
   <img alt="Candeias" id="banner-img" src="img/museu.jpg"/>
   <div class="banner-info">
    <span>
     Turismo 360°
    </span>
    <h1 id="banner-title">
    </h1>
    <p id="banner-text">
    </p>
   </div>
   <button class="banner-btn next" id="next">
    ›
   </button>
  </section>
  <section class="section">
   <div class="section-title">
    <div>
     <h2 data-i18n="featured">
     </h2>
    </div>
   </div>
   <div class="card">
    <h3 data-i18n="festival_title">
    </h3>
    <p data-i18n="festival_text">
    </p>
    <div class="card-actions">
     <a class="btn" data-i18n="explore_btn" href="projetos.html?filter=event">
     </a>
    </div>
   </div>
  </section>
  <section class="section">
   <div class="section-title">
    <h2 data-i18n="explore_title">
    </h2>
   </div>
   <div class="cards">
    <a class="card" href="projetos.html?filter=event" style="text-decoration:none">
     <img alt="" src="img/evento.jpg"/>
     <h3 data-i18n="events">
     </h3>
     <p data-i18n="events_desc">
     </p>
    </a>
    <a class="card" href="projetos.html?filter=place" style="text-decoration:none">
     <img alt="" src="img/museu.jpg"/>
     <h3 data-i18n="places">
     </h3>
     <p data-i18n="places_desc">
     </p>
    </a>
    <a class="card" href="sobre.html#historia" style="text-decoration:none">
     <img alt="" src="img/cidade.jpg"/>
     <h3 data-i18n="history">
     </h3>
     <p data-i18n="history_desc">
     </p>
    </a>
   </div>
  </section>
  <footer>
   <div data-i18n="footer">
   </div>
   <div class="steam" data-i18n="steam">
   </div>
  </footer>
  <script src="script.js">
  </script>
 </body>
</html>
