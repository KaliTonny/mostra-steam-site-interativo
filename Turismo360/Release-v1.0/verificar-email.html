<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar e-mail | Turismo 360°</title><link rel="stylesheet" href="style.css"></head><body><main class="cadastro-container"><section class="auth-box verification-box"><h1>Verifique seu e-mail</h1><p class="intro">Enviamos um código de 6 dígitos para <strong id="maskedEmail"></strong>.</p><form id="verifyForm" class="form-grid"><label for="codigo">Código de verificação</label><input id="codigo" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button class="primary" type="submit">Verificar código</button><p id="verifyStatus"></p></form><button id="resendCode" class="secondary resend-btn" type="button">Reenviar código em 60s</button><p class="auth-links"><a href="login.html">Voltar para o login</a></p></section></main><footer><div>© 2026 - Desenvolvido por Etony Guedes e Geovanna Almeida</div></footer><script src="script.js"></script></body></html>
