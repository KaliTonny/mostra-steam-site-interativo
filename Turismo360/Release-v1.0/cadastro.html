<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Turismo 360°</title><link rel="stylesheet" href="style.css"></head><body><main class="cadastro-container"><section class="auth-box"><h1>Turismo 360°</h1><p class="intro" data-i18n="register_intro"></p><form id="cadastroForm" class="form-grid"><label for="nome" data-i18n="name"></label><input id="nome" type="text" required data-i18n-placeholder="name_placeholder"><label for="email" data-i18n="email"></label><input id="email" type="email" required data-i18n-placeholder="email_placeholder"><label for="senha" data-i18n="password"></label><div class="password-wrap"><input id="senha" type="password" required autocomplete="new-password" data-i18n-placeholder="password_placeholder"><button type="button" class="password-toggle" data-toggle-password="senha" aria-label="Mostrar senha">👁</button></div><div class="password-strength"><div id="strengthBar"></div></div><small id="strengthText">Força da senha</small><ul class="password-rules"><li data-rule="length">8 ou mais caracteres</li><li data-rule="upper">Uma letra maiúscula</li><li data-rule="lower">Uma letra minúscula</li><li data-rule="number">Um número</li><li data-rule="special">Um caractere especial</li></ul><label for="confirmarSenha">Confirmar senha</label><div class="password-wrap"><input id="confirmarSenha" type="password" required autocomplete="new-password" placeholder="Digite a senha novamente"><button type="button" class="password-toggle" data-toggle-password="confirmarSenha" aria-label="Mostrar senha">👁</button></div><small id="matchText"></small><button class="primary" type="submit" data-i18n="register"></button><p id="mensagem"></p></form><p class="auth-links"><span data-i18n="already_account"></span> <a href="login.html" data-i18n="enter"></a> · <a href="home.html" data-i18n="back_home"></a></p></section></main><footer><div data-i18n="footer"></div><div class="steam" data-i18n="steam"></div></footer><script src="script.js"></script></body></html>
