<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cadastro-container">
    <h1>Cadastre-se</h1>
    <p class="steam" style="margin-top: 5px; margin-bottom: 15px; text-align: center; font-size: 16px;">
      Crie sua conta e comece a explorar o mundo com a gente!
    </p>
    
    <form id="cadastroForm" class="cadastro-form">
      <input type="text" id="nome" placeholder="Digite seu nome">
      <input type="email" id="email" placeholder="Digite seu e-mail">
      <input type="password" id="senha" placeholder="Digite sua senha">

      <button type="submit">Cadastrar</button>

      <p id="mensagem"></p>

      <p class="login-link">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>

      <a href="home.html" class="voltar-btn">Voltar</a>
    </form>
  </main>

  <footer class="footer-cadastro">
    © 2026 Projeto desenvolvido por: Geovanna Almeida • Etony Guedes • Nicolle Borges • Eric das Mercês
    <br><br>
    <span class="steam">Desenvolvido para a Mostra STEAM</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
